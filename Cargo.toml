[package]
name = "bevy_game_2d"
authors = ["Abigail Moore <abigailmmoore00@gmail.com>"]
version = "0.1.0"
edition = "2024"

[workspace]
members = [
    ".",
    "crates/datagen",
    "crates/game/app", "crates/game/common", "crates/game/data", "crates/game/physics",
    "crates/macros/maybe_fields",
]
resolver = "2"

[workspace.dependencies]
bevy = { version = "0.19", default-features = false, features = [
    # Base feature sets
    "2d",
    "ui",

    # Additional features
    "audio",
    "bevy_state",
    "debug",
    "multi_threaded",
    "reflect_auto_register",
    "serialize",
    "std",
    "sysinfo_plugin",
    "trace",

    # UI and input
    "system_clipboard",

    # Gamepad functionality
    "bevy_gilrs",
    "bevy_input_focus",

    # File formats
    "png",
    "vorbis",

    # Picking (aka clicking on world objects)
    "ui_picking",
    "sprite_picking",

    # Linux rendering
    "wayland",
    "x11",
] }
serde = "1.0.228"
getset = "0.1.6"
regex = "1.12.3"
thiserror = "2.0.17"

common = { path = "crates/game/common" }
data = { path = "crates/game/data" }
physics = { path = "crates/game/physics" }

maybe_fields = { path = "crates/macros/maybe_fields" }

[features]
# Default to a native dev build.
default = ["dev_native"]
dev = [
    # Improve compile times for dev builds by linking Bevy as a dynamic library.
    "bevy/dynamic_linking",
    # Improve error messages coming from Bevy
    "bevy/track_location",

    "bevy/bevy_dev_tools",
    "bevy/bevy_ui_debug",
    "bevy/bevy_feathers",

    "bevy_mod_debugdump",
    "graphviz-rust",
]
dev_native = [
    "dev",
    # Enable asset hot reloading for native dev builds.
    "bevy/file_watcher",
    # Enable embedded asset hot reloading for native dev builds.
    "bevy/embedded_watcher",
]

[dependencies]
bevy = { workspace = true }

bevy_mod_debugdump = { version = "0.16.0", optional = true }
graphviz-rust = { version = "0.9.8", optional = true }

app = { path = "crates/game/app", features = ["dev"] }


# Compile with Performance Optimizations:
# <https://bevyengine.org/learn/quick-start/getting-started/setup/#compile-with-performance-optimizations>

# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3

# Remove expensive debug assertions due to <https://github.com/bevyengine/bevy/issues/14291>
[profile.dev.package.wgpu-types]
debug-assertions = false

[profile.release]
# Compile the entire crate as one unit.
# Slows compile times, marginal improvements.
codegen-units = 1
# Do a second optimization pass over the entire program, including dependencies.
# Slows compile times, marginal improvements.
lto = "thin"

# This profile will be used by `bevy run web` automatically.
[profile.web-release]
# Default to release profile values.
inherits = "release"
# Optimize with SIZE in mind (also try "z", sometimes it is better).
# Slightly slows compile times, great improvements to file SIZE and runtime performance.
opt-level = "s"
# Strip all debugging information from the binary to slightly reduce file SIZE.
strip = "debuginfo"

# Optimize for build time in CI.
[profile.ci]
inherits = "dev"
opt-level = 0
debug = "line-tables-only"
codegen-units = 4

[profile.ci.package."*"]
opt-level = 0
